<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemi Takip Sistemi</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
        }
        .leaflet-popup-content {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }
        /* Ufak bilgi kutusu (Hataları ve bekleme durumunu göstermek için) */
        #infoBox {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 14px;
            z-index: 1000;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: opacity 0.5s;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="infoBox">Sisteme bağlanılıyor...</div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        let marker;
        let socket;

        const API_KEY = "2592f9c9ab177b85ed30b95a5ee3a42309338da5";
        const TARGET_MMSI = "371305000";

        const shipIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3211/3211116.png',
            iconSize: [40, 40],
            iconAnchor: [20, 20],
            popupAnchor: [0, -20]
        });

        const infoBox = document.getElementById('infoBox');

        function setInfo(msg, isError = false) {
            infoBox.textContent = msg;
            infoBox.style.background = isError ? 'rgba(220, 53, 69, 0.9)' : 'rgba(0, 0, 0, 0.7)';
            infoBox.classList.remove('hidden');
        }

        function hideInfo() {
            infoBox.classList.add('hidden');
        }

        function initMap() {
            map = L.map('map').setView([39.0, 35.0], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }

        function connectAISStream() {
            if (socket) socket.close();

            socket = new WebSocket("wss://stream.aisstream.io/v0/stream");

            socket.onopen = function () {
                setInfo("Bağlanıldı. Gemiden yeni sinyal bekleniyor...");
                let subscriptionMessage = {
                    Apikey: API_KEY,
                    BoundingBoxes: [[[-90, -180], [90, 180]]],
                    FiltersShipMMSI: [TARGET_MMSI],
                    FilterMessageTypes: ["PositionReport"]
                }
                socket.send(JSON.stringify(subscriptionMessage));
            };

            socket.onmessage = async function (event) {
                try {
                    let dataText = event.data;
                    if (event.data instanceof Blob) {
                        dataText = await event.data.text();
                    }

                    let aisMessage = JSON.parse(dataText);
                    
                    if (aisMessage["MessageType"] === "PositionReport") {
                        let positionReport = aisMessage["Message"]["PositionReport"];
                        let lat = positionReport["Latitude"];
                        let lon = positionReport["Longitude"];
                        let speed = positionReport["Sog"];
                        let course = positionReport["Cog"];
                        
                        updateMap(lat, lon, speed, course);
                        hideInfo(); // Veri geldiğinde bilgi kutusunu gizle
                    }
                } catch (err) {
                    console.error("Veri hatası:", err);
                }
            };

            socket.onerror = function(error) {
                // Eğer konsolda 429 vs dönerse buraya düşer
                setInfo("Bağlantı Hatası! API Limitine takılmış olabilirsiniz.", true);
            };

            socket.onclose = function(event) {
                if (event.code === 1008 || event.code === 1011) {
                    setInfo("Hata: API Anahtarı reddedildi (Çok fazla bağlantı/429).", true);
                } else {
                    setInfo("Bağlantı koptu. 10 saniye içinde yeniden deneniyor...", true);
                }
                setTimeout(connectAISStream, 10000); // Çok fazla istek atmamak için süreyi 10 saniyeye çıkardık
            };
        }

        function updateMap(lat, lon, speed, course) {
            const popupText = `<b>Takip Edilen Gemi</b><br>MMSI: ${TARGET_MMSI}<br>Hız: ${speed ? speed.toFixed(1) : '-'} knot<br>Rota: ${course ? course.toFixed(1) : '-'}°`;
            
            if (marker) {
                marker.setLatLng([lat, lon]);
                marker.getPopup().setContent(popupText);
            } else {
                marker = L.marker([lat, lon], {icon: shipIcon}).addTo(map);
                marker.bindPopup(popupText).openPopup();
            }
            map.setView([lat, lon], 12);
        }

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            connectAISStream();
        });
    </script>
</body>
</html>
